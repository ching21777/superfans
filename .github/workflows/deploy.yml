
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test
          path: test-source

      - name: Build website
        run: |
          mkdir -p _site/test
          rsync -a --exclude='.git' main-source/ _site/
          rsync -a --exclude='.git' test-source/ _site/test/

          # 只在測試版注入開發工具
          if [ -f _site/test/dev/dev.js ]; then
            sed -i 's|</body>|<script src="./dev/dev.js"></script>\n</body>|' _site/test/index.html
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
