name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - test
      - beta
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test
          path: test-source

      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-source

      - name: Build website
        run: |
          mkdir -p _site/test _site/beta
          rsync -a --exclude='.git' main-source/ _site/
          rsync -a --exclude='.git' test-source/ _site/test/
          rsync -a --exclude='.git' beta-source/ _site/beta/

          # test 保留 index.html 原本載入的開發工具，不再重複注入
          # beta 不發布開發工具，也移除 HTML 中的載入程式
          rm -rf _site/beta/dev
          sed -i '/dev\/dev\.js/d' _site/beta/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
